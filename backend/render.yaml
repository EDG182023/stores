# Blueprint de Render: New > Blueprint > conectar el repo
services:
  - type: web
    name: stockfacil-bot
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TZ_NEGOCIO
        value: America/Argentina/Buenos_Aires
